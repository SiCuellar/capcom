[package]
name = "capcom"
version = "0.1.0"
edition = "2021"
description = "Private, self-hosted dictation client (Capcom)"
license = "MIT"
publish = false

[lib]
name = "capcom"
path = "src/lib.rs"

[[bin]]
name = "capcom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
# `rustls` is the reqwest 0.13 name of what used to be `rustls-tls`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
dirs = "6"
cpal = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
handy-keys = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
# Menu-bar app host: marshal UiEvents to the main queue; "Launch at login" via SMAppService.
dispatch2 = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# Pill overlay (CALayer rendering, NSTimer blocks).
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
