# Plain Hyprland (hyprlang config) push-to-talk for Capcom.
# NOT needed on Omarchy (it binds F9 / Right Alt / Super+Ctrl+X to omarchy-dictation).
# Usage: `source = ~/.config/hypr/capcom-binds.conf` in hyprland.conf.
#
# bind = press; bindrin = release (r) ignoring modifiers (i) and non-consuming (n).
bind   = , F9, exec, capcom start
bindrin = , F9, exec, capcom stop
bind   = SUPER CTRL, X, exec, capcom toggle
bind   = SUPER CTRL, ESCAPE, exec, capcom cancel
